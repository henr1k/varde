name: Lint Frontend

on:
  # Called by varde-image.yml so an image is only published from a tested commit.
  workflow_call:
  push:
    branches:
      - master
      - main
    paths:
      - frontend/**
      - .github/workflows/lint-frontend.yml
  pull_request:
    paths:
      - frontend/**
      - .github/workflows/lint-frontend.yml

concurrency:
  # Prefix plus workflow: called from varde-image.yml, github.workflow is the caller's name,
  # so standalone and called runs stay in separate groups.
  group: lint-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  frontend:
    name: Frontend (format + lint + type-check + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting (Prettier)
        working-directory: frontend
        run: npm run format:check

      - name: Check linting (oxlint + ESLint)
        working-directory: frontend
        run: npm run lint:check

      - name: Type check (vue-tsc)
        working-directory: frontend
        run: npm run type-check

      - name: Unit tests with coverage gate
        working-directory: frontend
        run: npm run test:coverage
